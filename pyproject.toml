[project]
name = "structured-data-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aannasaltykovaa", email = "aannasaltykovaa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "instructor>=1.17.0",
    "json-repair>=0.64.9",
    "openai>=3.3.0",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
structured-data-extractor = "structured_data_extractor:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "reportlab>=5.1.0",
]
